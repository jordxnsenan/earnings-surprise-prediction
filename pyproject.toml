
[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "earnings-surprise-prediction"
version = "0.1.0"
description = "A data mining study of historical earnings patterns and earnings surprise prediction."
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "pyarrow>=16,<25",
    "scikit-learn>=1.5,<2",
    "xgboost>=2.1,<4",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<1",
    "huggingface-hub>=0.26,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "jupyterlab>=4,<5",
    "ipykernel>=6,<8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]